<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d"><title id="t">Stateweave — State machine designer</title><desc id="d">Animated connected state nodes with a flowing transition path.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#1b1b3b"/><stop offset="1" stop-color="#0a1020"/></linearGradient><linearGradient id="edge"><stop stop-color="#62e3c1"/><stop offset="1" stop-color="#a89bff"/></linearGradient></defs><rect width="1200" height="320" rx="24" fill="url(#bg)"/><g stroke="url(#edge)" stroke-width="4" fill="none" stroke-linecap="round"><path d="M180 160 C310 160 320 80 450 80 S600 160 720 160 S890 240 1020 240" stroke-dasharray="16 12"><animate attributeName="stroke-dashoffset" values="0;-112" dur="3s" repeatCount="indefinite"/></path><path d="M180 160C300 160 320 245 450 245" opacity=".55"/></g><g fill="#142542" stroke-width="3"><rect x="105" y="125" width="150" height="70" rx="15" stroke="#62e3c1"/><rect x="375" y="45" width="150" height="70" rx="15" stroke="#a89bff"/><rect x="645" y="125" width="150" height="70" rx="15" stroke="#62e3c1"/><rect x="945" y="205" width="150" height="70" rx="15" stroke="#a89bff"/></g><g fill="#edf3ff" font-family="monospace" font-size="17" text-anchor="middle"><text x="180" y="167">IDLE</text><text x="450" y="87">ACTIVE</text><text x="720" y="167">REVIEW</text><text x="1020" y="247">DONE</text></g><g fill="#62e3c1"><circle r="6"><animateMotion dur="3s" repeatCount="indefinite" path="M180 160 C310 160 320 80 450 80 S600 160 720 160 S890 240 1020 240"/></circle></g><text x="58" y="48" fill="#edf3ff" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="5">STATEWEAVE</text><text x="1140" y="48" text-anchor="end" fill="#91a0ba" font-family="monospace" font-size="13" letter-spacing="3">STATES / EVENTS / TRANSITIONS</text></svg>